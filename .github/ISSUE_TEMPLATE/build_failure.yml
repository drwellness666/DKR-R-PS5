name: Local build failure
description: Report a failure in the public source recipe without sharing private build inputs.
body:
  - type: checkboxes
    attributes:
      label: Private inputs
      options:
        - label: I will share only source/build diagnostics and no ROM or ROM-derived output.
          required: true
  - type: input
    attributes:
      label: Port version, build OS and tool versions
      description: Include Linux distribution, whether WSL2 is used, and compiler/LLD, CMake and Python versions.
    validations:
      required: true
  - type: input
    attributes:
      label: Selected revision
      description: US 1.0, US 1.1 / Rev A, or both. Do not attach the ROM.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Failed stage and exact diagnostic
      description: Source preparation, matching decomp, CPU generation, library build, native link or installer. Include a short relevant error and command with private paths removed.
    validations:
      required: true
