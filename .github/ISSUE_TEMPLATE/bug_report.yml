name: Game or controller problem
description: Report a problem with the PS5 port.
body:
  - type: checkboxes
    attributes:
      label: Before attaching files
      options:
        - label: I will not attach ROMs, extracted game data, saves, packs or full console logs.
          required: true
  - type: input
    attributes:
      label: Port version
      description: The version from the download or Graphics settings.
    validations:
      required: true
  - type: input
    attributes:
      label: Active game revision
      description: US 1.0 or US 1.1 / Rev A, shown under Touchpad → Play. Do not attach the ROM.
    validations:
      required: true
  - type: input
    attributes:
      label: PS5 firmware and homebrew setup
      description: Firmware, loader, kstuff and ShadowMount versions, when known. For save problems, mention whether the console was restarted.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction and visible result
      description: Smallest sequence, expected result, actual picture/sound/input, exact error, and whether the console menu stays usable.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Settings and comparison
      description: Accurate/Modern, resolution/aspect/frame rate, texture pack on/off, cold/warm, and whether this happens without the pack.
  - type: textarea
    attributes:
      label: Relevant diagnostic excerpt
      description: Optional: a short DKR-R error excerpt with private paths/addresses removed. A photo can help too.
      render: text
