name: Console bug
description: Report a problem with the PS5 port.
body:
  - type: checkboxes
    attributes:
      label: Private data
      options:
        - label: I will not attach ROMs, generated game code, binaries/installers, saves, packs or full console dumps.
          required: true
  - type: input
    attributes:
      label: Port version
      description: The port version from the download or the build ID in Graphics.
    validations:
      required: true
  - type: input
    attributes:
      label: Active game revision
      description: US 1.0 or US 1.1 / Rev A, shown under Touchpad → Play. Do not attach the ROM.
    validations:
      required: true
  - type: input
    attributes:
      label: PS5 firmware and homebrew setup
      description: Firmware, loader, kstuff and ShadowMount versions when known. For save issues, state whether this followed a full console reboot and which port build was used.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction and visible result
      description: Smallest sequence, expected result, actual picture/sound/input, exact error, and whether the console menu stays usable.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Settings and comparison
      description: Accurate/Modern, resolution/aspect/frame rate, texture pack on/off, cold/warm, and whether this happens without the pack.
  - type: textarea
    attributes:
      label: Relevant diagnostic excerpt
      description: Short DKR-R-only excerpt with private addresses removed; not a full console log. State which diagnostic flags were enabled.
      render: text
