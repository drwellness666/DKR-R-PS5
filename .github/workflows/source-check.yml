name: ROM-free source checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: source-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/check_public_source.py .
      - run: sha256sum --quiet -c SHA256SUMS
      - run: python3 tools/test_component_notices.py
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libsdl2-dev glslang-tools spirv-tools libvulkan-dev mesa-vulkan-drivers pkg-config
      - run: python3 tools/prepare_controller_test_sources.py "$PWD/work/controller-test-inputs"
      - run: python3 tools/test_upstream_release_composition.py "$PWD/work/controller-test-inputs"
      - run: python3 tools/test_ps5_store_http.py
      - run: python3 tools/test_ps5_shared_save_jobs.py "$PWD/work/controller-test-inputs"
      - run: python3 tools/test_controller_presets.py "$PWD/work/controller-test-inputs"
      - run: python3 tools/test_ps5_controller_lights.py
      - run: python3 tools/test_ps5_motion.py
      - run: python3 tools/test_ps5_item_feedback.py
      - run: python3 tools/test_ps5_controller_speaker.py
      - run: python3 tools/test_ps5_controller_diagram.py "$PWD/work/controller-test-inputs"
      - run: python3 tools/test_ps5_game_audio_hooks.py "$PWD/work/controller-test-inputs"
      - run: python3 tools/test_ps5_file_picker.py "$PWD/work/controller-test-inputs"
      - run: python3 tools/test_ps5_texture_import_worker.py "$PWD/work/controller-test-inputs"
      - run: python3 tools/test_ps5_crt_overlay.py "$PWD/work/controller-test-inputs"
      - run: python3 tools/test_ps5_controls_page.py "$PWD/work/controller-test-inputs"
      - run: python3 tools/test_ps5_native_save_storage.py "$PWD/work/controller-test-inputs"
      - run: python3 tests/test_install_bootstrap.py
      - run: python3 tests/test_controller_audio_decode.py
      - run: python3 tools/test_ps5_shared_profiles.py
      - run: python3 tools/test_native_build_identity.py
      - run: python3 tools/test_record_native_build.py
      - run: python3 tools/test_ps5_display.py
      - run: python3 tools/test_ps5_hdr.py
      - run: python3 tools/test_ps5_preferences.py
      - run: python3 tools/build_hdr_shaders.py --check
      - run: python3 tools/test_ps5_hdr_vulkan.py
      - run: python3 tools/test_console_fonts.py "$PWD/work/controller-test-inputs"
      - run: python3 tools/test_native_display_rate.py "$PWD/work/controller-test-inputs"
      - run: python3 tools/test_console_play_navigation.py "$PWD/work/controller-test-inputs"
      - run: python3 tools/test_ps5_menu_sections.py "$PWD/work/controller-test-inputs"
      - run: python3 tests/test_build_assistant.py
      - run: python3 tools/test_ps5_internet_update.py
      - run: python3 tools/test_ps5_native_update.py
      - run: python3 tools/test_ps5_diagnostics.py
      - run: python3 tools/test_ps5_startup_diagnostics.py
      - run: python3 tools/test_native_game_installer.py
      - run: python3 tools/test_native_game_deployer.py
      - run: python3 tests/test_universal_installer.py
      - run: python3 tools/test_installation_lease.py
      - run: python3 tools/test_ps5_ui_framebuffer.py
      - run: python3 tools/test_journal_reader.py
      - run: python3 tools/test_ps5_driver_policy.py
      - run: python3 tools/test_texture_pack_copy.py
      - run: python3 tools/test_dependency_patch.py
      - run: python3 tools/test_game_dependency_preparation.py
      - run: python3 tools/test_update_baseline.py
      - run: python3 tools/test_session_tools.py
      - run: python3 tools/test_diagnostic_session_report.py
      - run: python3 tools/test_display_metadata_update.py
      - run: python3 tools/test_rom_checker.py
      - run: python3 tools/test_ps5_realpath.py
      - run: python3 tools/test_ps5_filesystem.py
      - run: python3 tools/test_ps5_getcwd.py
      - run: python3 tools/test_ps5_rdram.py
      - run: bash tools/test_save_metadata.sh "$PWD/work/save-metadata-tests"
      - run: python3 tools/test_upstream_title_art.py
      - run: python3 tools/test_title_metadata_audit.py
      - run: ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1 python3 tools/test_title_poster_retirement.py
      - run: python3 tools/test_performance_summary.py
      - run: python3 tools/test_revision_selection.py
      - run: ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1 python3 tools/test_game_language_bridge.py
      - run: ASAN_OPTIONS=detect_leaks=0 python3 tools/test_native_game_bundle_update.py
      - run: ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1 python3 tools/test_preview_update.py
      - run: python3 tools/test_preview_receipt.py
      - run: python3 tools/test_source_release_update.py
      - run: clang++ -std=c++20 -O1 -fsanitize=address,undefined -Isrc tests/neutral_audio.cpp -o /tmp/neutral-audio && ASAN_OPTIONS=detect_leaks=0 /tmp/neutral-audio
      - run: clang -std=c11 -Wall -Wextra -Werror -Isrc tests/shader_cache.c -o /tmp/shader-cache && /tmp/shader-cache
      - run: clang -std=c11 -Wall -Wextra -Werror -Isrc tests/render_diagnostics.c -o /tmp/render-diagnostics && /tmp/render-diagnostics
      - run: bash -n build.sh build_gpu.sh build_rt64.sh build_game.sh build_integrated.sh tools/*.sh
